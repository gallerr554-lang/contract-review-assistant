[project]
name = "contract-review-backend"
version = "0.1.0"
description = "FastAPI backend for the contract review assistant."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "SQLAlchemy==2.0.42",
  "psycopg[binary]==3.2.9",
  "alembic==1.16.4",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "pypdf==5.9.0",
  "python-docx==1.2.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
